name: Rol de spelserver uit naar Cloudflare

on:
  push:
    branches: [master]
    # de server bundelt ook de spelregels en spelgegevens van de client mee
    paths: ['server/**', '.github/workflows/server.yml', 'runeveld/src/data.js', 'runeveld/src/gebied.js', 'runeveld/src/regels/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy met wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
